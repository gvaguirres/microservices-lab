spring.application.name=userservice
server.port=8081

spring.datasource.url=${USER_DATASOURCE_URL:jdbc:postgresql://${USER_POSTGRES_HOST:localhost}:${USER_POSTGRES_PORT:5454}/${USER_POSTGRES_DB}}
spring.datasource.username=${USER_POSTGRES_USER}
spring.datasource.password=${USER_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
