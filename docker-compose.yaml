services:
  userservice-db:
    image: postgres:17
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    ports:
      - "5454:5432"
    volumes:
      - userservice_data:/var/lib/postgresql/data

  messageservice-db:
    image: postgres:17
    container_name: message-db
    environment:
      POSTGRES_DB: ${MESSAGE_POSTGRES_DB}
      POSTGRES_USER: ${MESSAGE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MESSAGE_POSTGRES_PASSWORD}
    ports:
      - "5455:5432"
    volumes:
      - messageservice_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  userservice_data:
  messageservice_data:
