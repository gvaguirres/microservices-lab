services:
  userservice-db:
    image: postgres:17
    container_name: user-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5454:5432"
    volumes:
      - userservice_data:/var/lib/postgresql/data

volumes:
  userservice_data:
