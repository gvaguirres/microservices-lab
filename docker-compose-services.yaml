services:
  authservice:
    build: ./authservice
    image: authservice:0.0.1-SNAPSHOT
    container_name: authservice
    ports:
      - "9000:9000"
    environment:
      AUTH_ISSUER_URI: http://authservice:9000
      AUTH_REDIRECT_URI: http://localhost:8080/login/oauth2/code/authservice

  bff:
    build: ./bff
    image: bff:0.0.1-SNAPSHOT
    container_name: bff
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://userservice:8081
      MESSAGE_SERVICE_URL: http://messageservice:8082
      AUTH_ISSUER_URI: http://authservice:9000
      AUTH_CLIENT_ID: gateway-client
      AUTH_CLIENT_SECRET: secret
      AUTH_REDIRECT_URI: http://localhost:8080/login/oauth2/code/authservice
    depends_on:
      - authservice
      - userservice
      - messageservice

  userservice:
    build: ./userservice
    image: userservice:0.0.1-SNAPSHOT
    container_name: userservice
    ports:
      - "8081:8081"
    environment:
      USER_DATASOURCE_URL: jdbc:postgresql://userservice-db:5432/${USER_POSTGRES_DB}
      USER_POSTGRES_USER: ${USER_POSTGRES_USER}
      USER_POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      USER_POSTGRES_DB: ${USER_POSTGRES_DB}
    depends_on:
      - userservice-db

  messageservice:
    build: ./messageservice
    image: messageservice:0.0.1-SNAPSHOT
    container_name: messageservice
    ports:
      - "8082:8082"
    environment:
      AUTH_ISSUER_URI: http://authservice:9000
      USERSERVICE_GRPC_ADDRESS: userservice:8081
      MESSAGE_DB_URL: jdbc:postgresql://messageservice-db:5432/${MESSAGE_POSTGRES_DB}
      MESSAGE_POSTGRES_USER: ${MESSAGE_POSTGRES_USER}
      MESSAGE_POSTGRES_PASSWORD: ${MESSAGE_POSTGRES_PASSWORD}
      MESSAGE_POSTGRES_DB: ${MESSAGE_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - messageservice-db
      - kafka
      - authservice
      - userservice

  userservice-db:
    image: postgres:17
    container_name: userservice-db
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    ports:
      - "5454:5432"
    volumes:
      - userservice_data:/var/lib/postgresql/data

  messageservice-db:
    image: postgres:17
    container_name: messageservice-db
    environment:
      POSTGRES_DB: ${MESSAGE_POSTGRES_DB}
      POSTGRES_USER: ${MESSAGE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MESSAGE_POSTGRES_PASSWORD}
    ports:
      - "5455:5432"
    volumes:
      - messageservice_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  userservice_data:
  messageservice_data:
